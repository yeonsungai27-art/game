<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="오목, 틱택토, 스네이크를 한곳에서 플레이해 보세요.">
<title>PIXEL PLAY — ZERO° 게임 아케이드</title>
<style>
:root {
  color-scheme: light;
  font-family: system-ui, sans-serif;
  --navy: #101629;
  --line: #ded5c6;
  background: #fff8eb;
  color: var(--navy);
}
* { box-sizing: border-box; }
body { margin: 0; }
header, main, footer { width: min(1080px, calc(100% - 40px)); margin: auto; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 0; }
header .site-logo { display: block; }
header .site-logo img { display: block; width: clamp(96px, 11vw, 122px); height: auto; }
nav { display: flex; gap: 24px; }
a { color: var(--navy); text-decoration-thickness: 2px; text-underline-offset: .25em; }
a:hover { text-decoration-thickness: 3px; }
a:focus-visible { outline: 2px solid var(--navy); outline-offset: 4px; }
.hero {
  position: relative;
  isolation: isolate;
  display: grid;
  align-items: center;
  justify-items: start;
  min-height: clamp(360px, 44vw, 510px);
  margin: clamp(16px, 3vw, 34px) 0 clamp(36px, 6vw, 64px);
  padding: clamp(18px, 4vw, 44px);
  overflow: hidden;
  border-radius: 12px;
  background: #eee2ce;
}
.hero img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 48%;
  z-index: -1;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(90deg, #101629bc 0%, #10162991 39%, #10162930 62%, transparent 82%);
}
.hero-copy {
  max-width: 100%;
  color: #fff;
  text-shadow: 0 2px 12px #070b17b3;
}
.hero .eyebrow { color: inherit; }
.eyebrow { color: var(--navy); letter-spacing: .11em; font-size: .75rem; font-weight: 700; }
h1 { margin: 12px 0 0; font-size: clamp(2.4rem, 6vw, 4.7rem); line-height: 1.12; letter-spacing: -.055em; word-break: keep-all; }
p { line-height: 1.65; }
.hero p { margin: 14px 0 0; }
section { padding: 28px 0 36px; border-top: 1px solid var(--line); }
h2 { margin: 0; font-size: 1.65rem; letter-spacing: -.03em; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 16px; }
article { display: grid; align-content: start; gap: 10px; min-width: 0; padding: 22px; border: 1px solid var(--line); border-radius: 10px; }
article h3, article p { margin: 0; }
article a { justify-self: start; padding: 6px 0; }
#music .grid + article { margin-top: 16px; }
footer { padding: 25px 0 40px; border-top: 1px solid var(--line); }
@media (max-width: 600px) {
  header, main, footer { width: calc(100% - 28px); }
  .hero { min-height: 330px; align-items: end; }
  .hero img { object-position: 63% center; }
  .hero::after { background: linear-gradient(0deg, #101629e8, #1016298c 43%, transparent 82%); }
  .hero h1 { font-size: clamp(1.8rem, 7vw, 2.4rem); }
}
#games .game-card { display: block; padding: 0; min-width: 0; }
.game-card a { display: block; width: 100%; padding: 0; border-radius: inherit; text-decoration: none; }
.game-cover {
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: 9px 9px 0 0;
}
.game-thumbnail { display: block; width: 100%; height: 100%; object-fit: cover; }
.omok-thumbnail { object-position: 50% 35%; }
.grid-thumbnail { transform: rotate(-2deg) scale(1.35); transform-origin: 50% 53%; }
.game-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 56px;
  padding: 12px;
}
.game-caption h3 { font-size: clamp(.875rem, 1.5vw, 1.05rem); }
.game-caption span { font-size: .75rem; white-space: nowrap; }
.game-card a:hover .game-caption span { text-decoration: underline; }
.snake-thumbnail { transform: scale(1.33); transform-origin: 58% 35%; }
.music-player { min-width: 0; }
.music-player summary {
  position: relative;
  display: grid;
  align-items: end;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: 8px;
  background: #112236;
  color: #fff;
  cursor: pointer;
  list-style: none;
}
.music-player summary::-webkit-details-marker { display: none; }
.music-player summary:focus-visible { outline: 2px solid var(--navy); outline-offset: 4px; }
.music-player img, .music-player summary::after {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.music-player img { object-fit: cover; }
.music-player summary::after {
  content: '';
  background: linear-gradient(0deg, #0d1425da 0%, transparent 65%);
}
.music-player-label {
  position: relative;
  z-index: 1;
  justify-self: start;
  margin: 12px;
  padding: 8px 12px;
  border-radius: 999px;
  background: #101629;
  font-size: .85rem;
  font-weight: 650;
}
.music-player:not([open]) .music-player-close, .music-player[open] .music-player-open { display: none; }
.music-player iframe { display: block; margin-top: 10px; }
.music-track { position: relative; min-width: 0; }
.music-track > iframe { display: block; }
.music-player-label { display: grid; gap: 3px; border-radius: 8px; }
.music-player-label strong { font-size: 1rem; }
.music-external:not(:focus) {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.music-external:focus {
  position: absolute;
  right: 8px;
  bottom: 8px;
  z-index: 2;
  background: #fff8eb;
  padding: 6px 8px;
  border-radius: 4px;
  font-size: .75rem;
}
.music-player-label { background: var(--player-button, #101629); color: #fffaf2; }
.music-player summary:hover .music-player-label { box-shadow: 0 0 0 1px #fffaf2; }
.music-track .music-player[open] + .music-external {
  position: static;
  display: inline-block;
  width: auto;
  height: auto;
  margin-top: 7px;
  padding: 0;
  clip-path: none;
  overflow: visible;
  font-size: .72rem;
}
</style>
</head>
<body>
<header>
  <a class="site-logo" href="https://yeonsungai27-art.github.io/"><img src="/zero-logo.png" width="534" height="131" alt="ZERO° 홈"></a>
  <nav aria-label="주 메뉴"><a href="#games">게임</a><a href="#guide">플레이 안내</a><a href="https://yeonsungai27-art.github.io/index..html">음악</a></nav>
</header>
<main>
  <div class="hero">
    <div class="hero-copy">
      <h1>PIXEL PLAY</h1>
      <p>오목, 틱택토, 스네이크를 한곳에서 플레이해 보세요.</p>
    </div>
    <img src="/afternoon-train.jpg" width="1536" height="1024" alt="오후 햇살이 드는 전철 안과 창밖으로 보이는 푸른 풍경">
  </div>
  <section id="games" aria-labelledby="games-title">
    <h2 id="games-title">게임</h2>
    <div class="grid">
      <article class="game-card">
        <a href="https://yeonsungai27-art.github.io/game/01.html" aria-label="오목 · Grandmaster AI 플레이">
          <div class="game-cover"><img class="game-thumbnail omok-thumbnail" src="/game/omok-board-photo.jpg" width="1080" height="1920" loading="lazy" alt=""></div>
          <div class="game-caption"><h3>오목 · Grandmaster AI</h3><span aria-hidden="true">플레이 ↗</span></div>
        </a>
      </article>
      <article class="game-card">
        <a href="https://yeonsungai27-art.github.io/game/02.html" aria-label="NEON GRID 플레이">
          <div class="game-cover"><img class="game-thumbnail grid-thumbnail" src="/grid-afternoon.jpg" width="1536" height="1024" loading="lazy" alt=""></div>
          <div class="game-caption"><h3>NEON GRID</h3><span aria-hidden="true">플레이 ↗</span></div>
        </a>
      </article>
      <article class="game-card">
        <a href="https://yeonsungai27-art.github.io/game/03.html" aria-label="NEON SNAKES 플레이">
          <div class="game-cover"><img class="game-thumbnail snake-thumbnail" src="/snake-afternoon.jpg" width="1536" height="1024" loading="lazy" alt=""></div>
          <div class="game-caption"><h3>NEON SNAKES</h3><span aria-hidden="true">플레이 ↗</span></div>
        </a>
      </article>
    </div>
  </section>
  <section id="guide" aria-labelledby="guide-title">
    <h2 id="guide-title">플레이 안내</h2>
    <p>오목은 AI 또는 친구와 번갈아 돌을 놓는 게임이에요. 진화형 틱택토는 한 화면에서 번갈아 플레이하고, 스네이크 서바이벌은 WASD와 방향키를 나눠 동시에 플레이해요.</p>
  </section>
</main>
<footer><a href="https://yeonsungai27-art.github.io/">ZERO° 작품 모음으로 돌아가기 ↗</a></footer>
</body>
</html>
